# Workflow and dependency changes require the full test suite.
# With some-with-excludes, negative patterns exclude a file from a matched group.
full:
  - '.github/**'
  - 'AGENTS.md'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'package.json'
  - 'package-lock.json'
  - 'scripts/ci/**'
lint:
  - 'src/**'
  - 'frontend/**'
  - 'tests/**'
  - 'migrations/**'
  - 'scripts/**'
  - '!**/*.md'
python:
  - 'src/**'
  - 'tests/**/*.py'
  - 'scripts/**/*.py'
  - 'migrations/**'
  - '!**/*.md'
postgres:
  - 'src/**'
  - 'migrations/**'
  - 'tests/conftest.py'
  - 'tests/test_postgres*.py'
  - 'alembic.ini'
  - '!**/*.md'
browser:
  - 'frontend/**'
  - 'tests/browser/**'
  - '!**/*.md'
migrations:
  - 'migrations/**'
  - 'src/topsbottg/models.py'
  - 'alembic.ini'
  - 'tests/test_postgres_legacy_migrations.py'
  - '!**/*.md'
package:
  - 'src/**'
  - 'frontend/**'
  - 'migrations/**'
  - 'scripts/**'
  - 'nginx/**'
  - 'Dockerfile'
  - '.dockerignore'
  - 'docker-compose.yml'
  - 'alembic.ini'
  - '!**/*.md'
# Files outside known categories trigger full CI.
# Most Markdown is documentation-only; AGENTS.md and .github/** are exceptions.
unclassified:
  - '**'
  - '!**/*.md'
  - '!docs/**'
  - '!.github/**'
  - '!src/**'
  - '!frontend/**'
  - '!tests/**'
  - '!migrations/**'
  - '!scripts/**'
  - '!nginx/**'
  - '!Dockerfile'
  - '!.dockerignore'
  - '!docker-compose.yml'
  - '!alembic.ini'
  - '!pyproject.toml'
  - '!uv.lock'
  - '!package.json'
  - '!package-lock.json'
  - '!AGENTS.md'
