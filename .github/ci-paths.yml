# Default to a full CI run for workflow/dependency changes or unclassified files.
# dorny/paths-filter@v4 uses "some-with-excludes": a negative rule is final.
full:
  - '.github/**'
  - 'AGENTS.md'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'package.json'
  - 'package-lock.json'
  - 'scripts/ci/**'
lint:
  - 'src/**'
  - 'frontend/**'
  - 'tests/**'
  - 'migrations/**'
  - 'scripts/**'
python:
  - 'src/**'
  - 'tests/**/*.py'
  - 'scripts/**/*.py'
  - 'migrations/**'
postgres:
  - 'src/**'
  - 'migrations/**'
  - 'tests/conftest.py'
  - 'tests/test_postgres*.py'
  - 'alembic.ini'
browser:
  - 'frontend/**'
  - 'tests/browser/**'
migrations:
  - 'migrations/**'
  - 'src/topsbottg/models.py'
  - 'alembic.ini'
  - 'tests/test_postgres_legacy_migrations.py'
package:
  - 'src/**'
  - 'frontend/**'
  - 'migrations/**'
  - 'scripts/**'
  - 'nginx/**'
  - 'Dockerfile'
  - '.dockerignore'
  - 'docker-compose.yml'
  - 'alembic.ini'
# Any file outside the explicitly classified areas forces a full CI run.
# Markdown files (including README and docs/) are documentation-only.
unclassified:
  - '**'
  - '!**/*.md'
  - '!docs/**'
  - '!.github/**'
  - '!src/**'
  - '!frontend/**'
  - '!tests/**'
  - '!migrations/**'
  - '!scripts/**'
  - '!nginx/**'
  - '!Dockerfile'
  - '!.dockerignore'
  - '!docker-compose.yml'
  - '!alembic.ini'
  - '!pyproject.toml'
  - '!uv.lock'
  - '!package.json'
  - '!package-lock.json'
  - '!AGENTS.md'
