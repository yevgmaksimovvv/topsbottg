name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: topsbottg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d topsbottg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: uv run --locked python -m pytest -q

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: find frontend -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Test payout message length helpers
        run: node --test tests/js/*.test.mjs

      - name: Check JavaScript modules through Nginx
        shell: bash
        run: |
          docker run --rm -d --name ci-nginx-mime-check \
            --add-host app:127.0.0.1 \
            -p 127.0.0.1:18081:80 \
            -e APP_DOMAIN=localhost \
            -v "$GITHUB_WORKSPACE/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$GITHUB_WORKSPACE/nginx/templates:/etc/nginx/templates:ro" \
            -v "$GITHUB_WORKSPACE/frontend:/usr/share/nginx/html/miniapp:ro" \
            nginx:1.27-alpine
          trap 'docker rm -f ci-nginx-mime-check >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18081/miniapp/ >/dev/null; then break; fi
            sleep 1
          done
          NGINX_BASE_URL=http://127.0.0.1:18081 uv run --locked python scripts/check_nginx_mime.py

      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/topsbottg
        run: uv run --locked alembic upgrade head

      - name: Build Docker image
        run: docker build --tag topsbottg:ci .
