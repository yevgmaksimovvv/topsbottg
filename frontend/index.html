<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>topsbottg</title>
    <link rel="stylesheet" href="/miniapp/styles.css?v=20261116-inbox-chat" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1 id="screen-title">Новая выплата</h1>
        <div class="header-actions">
          <button type="button" id="inbox-open" class="header-icon-button inbox-opener hidden"
            aria-label="Сообщения" title="Сообщения">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-4-.9L3 21l1.6-4.8A8.4 8.4 0 0 1 3 11.5a9 9 0 0 1 18 0Z"></path>
            </svg>
            <span id="inbox-unread" class="inbox-header-badge hidden" aria-live="polite"></span>
          </button>
          <button type="button" id="admins-open" class="header-icon-button hidden"
            aria-label="Управление администраторами" title="Администраторы">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.12 2.12-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21h-3v-.08a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2.12-2.12.06-.06A1.65 1.65 0 0 0 7.2 15a1.65 1.65 0 0 0-1.51-1H5v-3h.69a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L8.93 6l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V4h3v.88a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2.12 2.12-.06.06A1.65 1.65 0 0 0 19.4 10a1.65 1.65 0 0 0 1.51 1H21v3h-.09A1.65 1.65 0 0 0 19.4 15Z"></path>
            </svg>
          </button>
          <div id="auth-state" class="hidden"></div>
        </div>
      </header>
      <nav class="bottom-nav" aria-label="Разделы">
        <button
          type="button"
          data-mobile-view="composer"
          class="nav-button active"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v8M8 12h8"></path></svg
          ><span>Создать</span>
        </button>
        <button
          type="button"
          data-mobile-view="users"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            ></path></svg
          ><span>Выбор</span>
        </button>
        <button
          type="button"
          data-mobile-view="recipients"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m9 11 3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
            ></path></svg
          ><span>Получатели</span>
        </button>
        <button
          type="button"
          data-mobile-view="payouts"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 12a9 9 0 1 0 2.64-6.36L3 8M3 3v5h5M12 7v5l3 2"
            ></path></svg
          ><span>История</span>
        </button>
      </nav>
      <div id="auth-banner" class="notice hidden" role="status"></div>
      <div
        id="toast"
        class="toast hidden"
        role="status"
        aria-live="polite"
      ></div>

      <section class="workspace">
        <section
          class="screen"
          data-screen="composer"
          aria-labelledby="screen-title"
        >
          <form
            class="composer-form"
            data-action-form="create-payout"
            novalidate
          >
            <fieldset class="period-fields">
              <legend>Период</legend>
              <label class="field"
                ><span>С</span
                ><input
                  id="period-start"
                  type="text"
                  inputmode="numeric"
                  maxlength="5"
                  autocomplete="off"
                  placeholder="ДД.ММ"
                  aria-describedby="period-start-error"
              /></label>
              <label class="field"
                ><span>По</span
                ><input
                  id="period-end"
                  type="text"
                  inputmode="numeric"
                  maxlength="5"
                  autocomplete="off"
                  placeholder="ДД.ММ"
                  aria-describedby="period-end-error"
              /></label>
            </fieldset>
            <div class="period-errors">
              <span id="period-start-error" class="field-error"></span
              ><span id="period-end-error" class="field-error"></span>
            </div>
            <label class="field message-label"><span>Сообщение</span></label>
            <div class="message-editor">
              <textarea
                id="message-before"
                rows="3"
                aria-label="Текст до периода"
                data-message-part="messageBefore"
              ></textarea>
              <div class="protected-period">
                <svg
                  viewBox="0 0 16 16"
                  width="14"
                  height="14"
                  aria-hidden="true"
                >
                  <rect
                    x="3"
                    y="7"
                    width="10"
                    height="8"
                    rx="1.5"
                    fill="none"
                    stroke="currentColor"
                  />
                  <path
                    d="M5 7V5a3 3 0 0 1 6 0v2"
                    fill="none"
                    stroke="currentColor"
                  /></svg
                ><span id="protected-period">ДД.ММ – ДД.ММ</span>
              </div>
              <textarea
                id="message-after"
                rows="3"
                aria-label="Текст после периода"
                data-message-part="messageAfter"
              ></textarea>
              <output
                id="message-count"
                class="message-count"
                aria-label="Количество символов"
              ></output>
            </div>
            <button
              type="button"
              class="button button-quiet preview-toggle"
              data-action="toggle-preview"
              aria-expanded="false"
            >
              Посмотреть сообщение
            </button>
            <div
              id="payout-validation"
              class="form-error hidden"
              role="alert"
            ></div>
            <div class="form-actions">
              <button
                type="submit"
                data-action="create-payout"
                class="button button-primary"
              >
                Создать выплату
              </button>
              <div
                id="create-success"
                class="success-callout hidden"
                role="status"
              ></div>
            </div>
          </form>
        </section>

        <section
          class="screen"
          data-screen="users"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="selection-payout-context" class="payout-context"></div>
          <label class="search-field"
            ><span class="sr-only">Поиск пользователей по ФИО</span
            ><span aria-hidden="true">⌕</span
            ><input
              id="users-search"
              autocomplete="off"
              placeholder="Поиск по ФИО"
              aria-label="Поиск по ФИО"
          /></label>
          <label class="group-filter-field" for="users-group-filter">
            <span>Учебная группа</span>
            <select id="users-group-filter" aria-label="Фильтр по учебной группе">
              <option value="">Все группы</option>
            </select>
          </label>
          <div id="study-groups-state" class="group-filter-state" role="status"></div>
          <div id="users-lock-note" class="notice hidden"></div>
          <div id="users-state" class="list-state" role="status"></div>
          <div id="users-list" class="user-list" aria-live="polite"></div>
          <div id="users-more-state" class="list-state"></div>
          <button
            type="button"
            class="button button-quiet load-more hidden"
            data-action="load-more-users"
          >
            Загрузить ещё
          </button>
        </section>

        <section
          class="screen"
          data-screen="recipients"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="recipients-context" class="payout-context"></div>
          <div id="recipient-summary" class="recipient-summary"></div>
          <div
            id="recipient-filters"
            class="filter-row"
            role="group"
            aria-label="Фильтр получателей"
          >
            <button
              type="button"
              class="filter-button active"
              data-filter="all"
              aria-pressed="true"
            >
              Все
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="payable"
              aria-pressed="false"
            >
              К оплате
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="paid"
              aria-pressed="false"
            >
              Выплачено
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="problems"
              aria-pressed="false"
            >
              Проблемы
            </button>
          </div>
          <div id="recipients-state" class="list-state" role="status"></div>
          <div id="recipients-list" class="recipient-list"></div>
        </section>

        <section
          class="screen"
          data-screen="payouts"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="history-current-context" class="payout-context"></div>
          <div id="payouts-state" class="list-state" role="status"></div>
          <div id="payouts-list" class="payout-list"></div>
        </section>
      </section>

      <aside
        id="selection-bar"
        class="selection-bar hidden"
        aria-label="Массовое действие"
      >
        <div>
          <strong id="selected-count">0 получателей</strong
          ><button
            type="button"
            class="text-button"
            data-action="clear-selection"
          >
            Снять выбор
          </button>
        </div>
        <button
          type="button"
          class="button button-primary"
          data-action="send-payout"
        >
          Разослать
        </button>
      </aside>
    </main>

    <dialog id="inbox-dialog" class="inbox-dialog" aria-labelledby="inbox-title">
      <div class="inbox-panel">
        <header class="inbox-panel-header">
          <button type="button" id="inbox-back" class="header-icon-button" aria-label="Назад к диалогам" hidden>‹</button>
          <h2 id="inbox-title">Сообщения</h2>
          <button type="button" id="inbox-new" class="header-icon-button inbox-new-button" aria-label="Новый диалог" title="Новый диалог">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 6H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-8"/>
              <path d="m14 5 5 5M9 15l3.5-.8L21 5.7a2.1 2.1 0 0 0-3-3L9.8 11z"/>
            </svg>
          </button>
          <button type="button" id="inbox-close" class="header-icon-button" aria-label="Закрыть сообщения">×</button>
        </header>
        <section id="inbox-list-screen" class="inbox-screen" aria-label="Список диалогов">
          <div class="inbox-filters">
            <label class="sr-only" for="inbox-search">Поиск диалога по ФИО</label>
            <input id="inbox-search" type="search" autocomplete="off" placeholder="Поиск диалога" />
            <label class="sr-only" for="inbox-group">Фильтр группы</label>
            <select id="inbox-group" aria-label="Фильтр группы"><option value="">Все группы</option></select>
          </div>
          <p id="inbox-list-status" class="inbox-feedback" role="status"></p>
          <div id="inbox-conversations" class="inbox-scroll inbox-chat-list" aria-label="Диалоги"></div>
          <button type="button" id="inbox-list-retry" class="button button-quiet inbox-page-button hidden">Повторить загрузку</button>
          <button type="button" id="inbox-more" class="button button-quiet inbox-page-button hidden">Загрузить ещё</button>
        </section>
        <section id="inbox-new-screen" class="inbox-screen" aria-label="Новый диалог" hidden>
          <div class="inbox-filters">
            <label class="sr-only" for="inbox-new-search">Поиск зарегистрированного пользователя</label>
            <input id="inbox-new-search" type="search" autocomplete="off" maxlength="128" placeholder="ФИО пользователя" />
            <label class="sr-only" for="inbox-new-group">Группа пользователя</label>
            <select id="inbox-new-group" aria-label="Группа пользователя"><option value="">Все группы</option></select>
          </div>
          <p id="inbox-new-status" class="inbox-feedback" role="status"></p>
          <div id="inbox-new-users" class="inbox-scroll inbox-chat-list" aria-label="Найденные пользователи"></div>
          <button type="button" id="inbox-new-retry" class="button button-quiet inbox-page-button hidden">Повторить поиск</button>
          <button type="button" id="inbox-new-more" class="button button-quiet inbox-page-button hidden">Загрузить ещё</button>
        </section>
        <section id="inbox-history-screen" class="inbox-screen" aria-label="История диалога" hidden>
          <p id="inbox-history-status" class="inbox-feedback" role="status"></p>
          <div id="inbox-history" class="inbox-scroll inbox-history-scroll" tabindex="0" aria-label="Сообщения диалога">
            <button type="button" id="inbox-older" class="inbox-older-button hidden">Загрузить предыдущие сообщения</button>
            <div id="inbox-messages" class="inbox-messages"></div>
          </div>
          <form id="inbox-composer" class="inbox-composer">
            <div id="inbox-reply" class="inbox-reply-preview"></div>
            <label class="sr-only" for="inbox-text">Написать сообщение</label>
            <div class="inbox-send-row">
              <textarea id="inbox-text" rows="1" maxlength="4096" placeholder="Сообщение" aria-label="Написать сообщение"></textarea>
              <button type="submit" id="inbox-send" class="inbox-send-button" aria-label="Отправить сообщение" title="Отправить сообщение">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
                  <path d="m4 20 16-8L4 4v6l9 2-9 2z"/>
                </svg>
              </button>
            </div>
            <p id="inbox-compose-status" class="inbox-feedback" role="status"></p>
          </form>
        </section>
      </div>
    </dialog>

    <dialog id="admins-dialog" class="admins-dialog" aria-labelledby="admins-title">
      <div class="admins-panel">
        <header class="admins-panel-header">
          <h2 id="admins-title">Администраторы</h2>
          <button type="button" id="admins-close" class="header-icon-button"
            aria-label="Закрыть окно администраторов">×</button>
        </header>
        <div class="admins-panel-content">
          <section aria-labelledby="admins-members-title" class="admins-section">
            <div class="admins-section-heading">
              <h3 id="admins-members-title">Команда</h3>
              <button type="button" id="admins-refresh" class="admins-text-button">Обновить</button>
            </div>
            <p id="admins-status" class="admins-feedback" role="status"></p>
            <div id="admins-members" class="admins-members"></div>
          </section>
          <section aria-labelledby="admins-invite-title" class="admins-section">
            <h3 id="admins-invite-title">Пригласить</h3>
            <div class="admins-search-form">
              <label for="admins-search-input" class="sr-only">ФИО или Telegram ID</label>
              <input id="admins-search-input" name="search" type="text" maxlength="128"
                autocomplete="off" placeholder="ФИО или Telegram ID" />
              <label for="admins-search-group" class="sr-only">Учебная группа — необязательно</label>
              <select id="admins-search-group" aria-label="Учебная группа — необязательно">
                <option value="">Все группы</option>
              </select>
            </div>
            <p id="admins-search-error" class="admins-feedback" role="status"></p>
            <div id="admins-candidate" aria-live="polite"></div>
          </section>
          <section aria-labelledby="admins-pending-title" class="admins-section">
            <h3 id="admins-pending-title">Приглашения</h3>
            <div id="admins-pending" class="admins-members"></div>
          </section>
        </div>
      </div>
    </dialog>

    <dialog
      id="confirm-dialog"
      class="confirm-dialog"
      aria-labelledby="dialog-title"
    >
      <form method="dialog">
        <button
          type="button"
          class="dialog-close"
          data-dialog-cancel
          aria-label="Закрыть"
        >
          ×
        </button>
        <h2 id="dialog-title"></h2>
        <div id="dialog-content" class="dialog-content"></div>
        <p id="dialog-warning" class="dialog-warning hidden"></p>
        <div class="dialog-actions">
          <button type="button" class="button button-quiet" data-dialog-cancel>
            Отмена</button
          ><button
            type="button"
            id="dialog-confirm"
            class="button button-primary"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title">
      <div class="preview-dialog-header">
        <h2 id="preview-title">Предпросмотр</h2>
        <button type="button" class="button button-quiet" data-action="close-preview" aria-label="Закрыть предпросмотр">Закрыть</button>
      </div>
      <pre id="preview" class="preview-root"></pre>
    </dialog>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/miniapp/app.js?v=20261116-inbox-chat"></script>
  </body>
</html>
