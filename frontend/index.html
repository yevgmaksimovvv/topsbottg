<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>topsbottg</title>
    <link rel="stylesheet" href="/miniapp/styles.css?v=20261108-redesign-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1 id="screen-title">Новая выплата</h1>
        <div id="auth-state" class="hidden"></div>
      </header>
      <nav class="bottom-nav" aria-label="Разделы">
        <button
          type="button"
          data-mobile-view="composer"
          class="nav-button active"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v8M8 12h8"></path></svg
          ><span>Создать</span>
        </button>
        <button
          type="button"
          data-mobile-view="users"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            ></path></svg
          ><span>Выбор</span>
        </button>
        <button
          type="button"
          data-mobile-view="recipients"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m9 11 3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
            ></path></svg
          ><span>Получатели</span>
        </button>
        <button
          type="button"
          data-mobile-view="payouts"
          class="nav-button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 12a9 9 0 1 0 2.64-6.36L3 8M3 3v5h5M12 7v5l3 2"
            ></path></svg
          ><span>История</span>
        </button>
      </nav>
      <div id="auth-banner" class="notice hidden" role="status"></div>
      <div
        id="toast"
        class="toast hidden"
        role="status"
        aria-live="polite"
      ></div>

      <section class="workspace">
        <section
          class="screen"
          data-screen="composer"
          aria-labelledby="screen-title"
        >
          <form
            class="composer-form"
            data-action-form="create-payout"
            novalidate
          >
            <fieldset class="period-fields">
              <legend>Период</legend>
              <label class="field"
                ><span>С</span
                ><input
                  id="period-start"
                  type="text"
                  inputmode="numeric"
                  maxlength="5"
                  autocomplete="off"
                  placeholder="ДД.ММ"
                  aria-describedby="period-start-error"
              /></label>
              <label class="field"
                ><span>По</span
                ><input
                  id="period-end"
                  type="text"
                  inputmode="numeric"
                  maxlength="5"
                  autocomplete="off"
                  placeholder="ДД.ММ"
                  aria-describedby="period-end-error"
              /></label>
            </fieldset>
            <div class="period-errors">
              <span id="period-start-error" class="field-error"></span
              ><span id="period-end-error" class="field-error"></span>
            </div>
            <label class="field message-label"><span>Сообщение</span></label>
            <div class="message-editor">
              <textarea
                id="message-before"
                rows="3"
                aria-label="Текст до периода"
                data-message-part="messageBefore"
              ></textarea>
              <div class="protected-period">
                <svg
                  viewBox="0 0 16 16"
                  width="14"
                  height="14"
                  aria-hidden="true"
                >
                  <rect
                    x="3"
                    y="7"
                    width="10"
                    height="8"
                    rx="1.5"
                    fill="none"
                    stroke="currentColor"
                  />
                  <path
                    d="M5 7V5a3 3 0 0 1 6 0v2"
                    fill="none"
                    stroke="currentColor"
                  /></svg
                ><span id="protected-period">ДД.ММ – ДД.ММ</span>
              </div>
              <textarea
                id="message-after"
                rows="3"
                aria-label="Текст после периода"
                data-message-part="messageAfter"
              ></textarea>
              <output
                id="message-count"
                class="message-count"
                aria-label="Количество символов"
              ></output>
            </div>
            <button
              type="button"
              class="button button-quiet preview-toggle"
              data-action="toggle-preview"
              aria-expanded="false"
            >
              Посмотреть сообщение
            </button>
            <div
              id="preview"
              class="preview-root hidden"
              aria-live="polite"
            ></div>
            <div
              id="payout-validation"
              class="form-error hidden"
              role="alert"
            ></div>
            <div class="form-actions">
              <button
                type="submit"
                data-action="create-payout"
                class="button button-primary"
              >
                Создать выплату
              </button>
              <div
                id="create-success"
                class="success-callout hidden"
                role="status"
              ></div>
            </div>
          </form>
        </section>

        <section
          class="screen"
          data-screen="users"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="selection-payout-context" class="payout-context"></div>
          <label class="search-field"
            ><span class="sr-only">Поиск пользователей по ФИО</span
            ><span aria-hidden="true">⌕</span
            ><input
              id="users-search"
              autocomplete="off"
              placeholder="Поиск по ФИО"
              aria-label="Поиск по ФИО"
          /></label>
          <div id="users-lock-note" class="notice hidden"></div>
          <div id="users-state" class="list-state" role="status"></div>
          <div id="users-list" class="user-list" aria-live="polite"></div>
          <div id="users-more-state" class="list-state"></div>
          <button
            type="button"
            class="button button-quiet load-more hidden"
            data-action="load-more-users"
          >
            Загрузить ещё
          </button>
        </section>

        <section
          class="screen"
          data-screen="recipients"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="recipients-context" class="payout-context"></div>
          <div id="recipient-summary" class="recipient-summary"></div>
          <div
            id="recipient-filters"
            class="filter-row"
            role="group"
            aria-label="Фильтр получателей"
          >
            <button
              type="button"
              class="filter-button active"
              data-filter="all"
              aria-pressed="true"
            >
              Все
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="payable"
              aria-pressed="false"
            >
              К оплате
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="paid"
              aria-pressed="false"
            >
              Выплачено
            </button>
            <button
              type="button"
              class="filter-button"
              data-filter="problems"
              aria-pressed="false"
            >
              Проблемы
            </button>
          </div>
          <div id="recipients-state" class="list-state" role="status"></div>
          <div id="recipients-list" class="recipient-list"></div>
        </section>

        <section
          class="screen"
          data-screen="payouts"
          aria-labelledby="screen-title"
          hidden
        >
          <div id="history-current-context" class="payout-context"></div>
          <div id="payouts-state" class="list-state" role="status"></div>
          <div id="payouts-list" class="payout-list"></div>
        </section>
      </section>

      <aside
        id="selection-bar"
        class="selection-bar hidden"
        aria-label="Массовое действие"
      >
        <div>
          <strong id="selected-count">0 получателей</strong
          ><button
            type="button"
            class="text-button"
            data-action="clear-selection"
          >
            Снять выбор
          </button>
        </div>
        <button
          type="button"
          class="button button-primary"
          data-action="send-payout"
        >
          Разослать
        </button>
      </aside>
    </main>

    <dialog
      id="confirm-dialog"
      class="confirm-dialog"
      aria-labelledby="dialog-title"
    >
      <form method="dialog">
        <button
          type="button"
          class="dialog-close"
          data-dialog-cancel
          aria-label="Закрыть"
        >
          ×
        </button>
        <h2 id="dialog-title"></h2>
        <div id="dialog-content" class="dialog-content"></div>
        <p id="dialog-warning" class="dialog-warning hidden"></p>
        <div class="dialog-actions">
          <button type="button" class="button button-quiet" data-dialog-cancel>
            Отмена</button
          ><button
            type="button"
            id="dialog-confirm"
            class="button button-primary"
          ></button>
        </div>
      </form>
    </dialog>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/miniapp/app.js?v=20261108-redesign-1"></script>
  </body>
</html>
